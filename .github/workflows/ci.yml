name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time placeholders so env validation does not fail in CI.
      MONGODB_URI: mongodb://localhost:27017/betnexus
      JWT_SECRET: ci_dummy_jwt_secret_at_least_thirty_two_chars_xx
      ADMIN_SETUP_SECRET: ci_dummy_admin_setup_secret_thirty_two_chars
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
